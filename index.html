<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EE">
  <title>SightScore — 視奏隨機題目生成器</title>
  <!--
    Safari's address bar and tab strip are browser chrome — a page has no
    API to hide them, on rotation or otherwise. The actual fix (and what
    these tags below enable) is launching from a home-screen icon instead
    of a Safari tab: iOS runs a "web app capable" page in standalone mode,
    full screen with no browser chrome at all, in both orientations.
    `manifest.json`'s `display: "standalone"` is the same thing for
    Android/desktop install prompts; the apple-specific tags are still
    needed alongside it since iOS Safari doesn't read the manifest for this.
  -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SightScore">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/app/styles.css?v=36">
  <!--
    Loaded from vendor/ rather than node_modules/ so the page works as a plain
    static site (GitHub Pages) with no build step and no npm install.
    See vendor/README.md for how to update it.
  -->
  <script src="vendor/opensheetmusicdisplay.min.js"></script>
</head>
<body>
  <!--
    Title left, transport right, one row, always. There is no fullscreen mode
    to hide this row or rearrange it — the whole page already shows nothing
    but the title bar, the key/tempo line and the score, so a distraction-free
    view would have nothing left to strip away. Since the buttons never move
    or disappear, generating a new test can only ever change the meta strip
    below, never this row.
  -->
  <header class="topbar">
    <div class="title-block">
      <h1>Sight<span>Score</span></h1>
    </div>

    <section class="controls">
      <button class="btn primary" id="generate">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        <span class="btn-label">產生新題目</span>
      </button>

      <button class="btn" id="prepare" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 1h6"/></svg>
        <span class="btn-label">開始 30 秒準備</span>
      </button>

      <button class="btn icon-only" id="play" disabled aria-label="播放" title="播放正確版本">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn icon-only" id="stop" disabled aria-label="停止" title="停止並回到開頭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2.6v12H6zm4.4 6l8.6 6V6z"/></svg>
      </button>
    </section>
  </header>

  <!--
    Key/time signature/bar count/tempo, directly below the title bar so it
    reads as "what this page is about" — never inside the controls row, so
    generating a new test (which changes this text's length) can never move
    a button. Hidden until there is a test to describe.

    On a screen with room to spare, the grade selector and countdown join
    this same row instead of sitting pinned to the score's own corners —
    app.js moves the actual #grade/#countdown elements in here (rather than
    duplicating them) so there is still only one of each answering events.
    This wrapper — not #meta itself — is what they're moved into, because
    showMeta() replaces #meta's innerHTML wholesale on every test and would
    wipe out anything appended directly inside it.
  -->
  <div class="meta-row" id="meta-row">
    <section id="meta" class="meta" hidden></section>
  </div>

  <main>
    <div class="score-frame" id="score-frame">
      <select id="grade" class="grade-select" aria-label="級數" title="級數">
        <option value="1">Grade 1</option>
        <option value="2">Grade 2</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
      </select>
      <!--
        Preparation countdown, pinned to the score's own top-right corner —
        symmetric with the grade selector at the top-left. Both read as
        "controls for this sheet of paper" rather than page chrome, and
        pinning them to its corners leaves the rest of the frame free for
        the engraving. Hidden until there is a test to prepare for.
      -->
      <div class="countdown" id="countdown" hidden>
        <span id="countdown-value">30</span><span class="unit">秒</span>
      </div>
      <div class="stage" id="stage">
        <div class="measure-highlight" id="measure-highlight"></div>
        <div id="score" class="score"></div>
        <div class="playline" id="playline"></div>
      </div>
    </div>
    <p id="message" class="message"></p>
    <ol class="checklist" id="checklist" hidden></ol>
  </main>

  <footer>
    <button id="clear-history" class="link">清除出題紀錄</button>
    <span class="spacer"></span>
    <span id="confidence" class="badge" hidden></span>
  </footer>

  <span id="history-info" class="history-badge"></span>

  <script type="module" src="src/app/app.js?v=36"></script>
</body>
</html>
